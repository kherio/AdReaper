name: Build APK

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub release (tag v<versionName>) from this run'
        type: boolean
        default: false

jobs:
  build:
    name: Build AdReaper
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Grant execution permission
        run: chmod +x ./gradlew

      - name: Prepare release signing (optional)
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # app/build.gradle resolves storeFile relative to the app module.
          echo "$KEYSTORE_BASE64" | base64 -d > app/adreaper.keystore

      - name: Build APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew assembleDebug assembleRelease

      - name: Extract version
        id: version
        run: |
          echo "VERSION=$(grep -oP "versionName \"\K[^\"]+" app/build.gradle)" >> "$GITHUB_OUTPUT"

      - name: Check tag matches versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.VERSION }}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match versionName ${{ steps.version.outputs.VERSION }}"
            exit 1
          fi

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/AdReaper-${{ steps.version.outputs.VERSION }}-debug.apk"
          # If Gradle did not sign the release (no secrets), sign it with uber-apk-signer.
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/AdReaper-${{ steps.version.outputs.VERSION }}-release.apk"
          else
            mkdir -p /tmp/adreaper
            wget -nv "https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar" -O /tmp/adreaper/uber-apk-signer.jar
            java -jar /tmp/adreaper/uber-apk-signer.jar --apks ./app/build/outputs/apk/release/app-release-unsigned.apk --out /tmp/adreaper/
            mv /tmp/adreaper/app-release-aligned-debugSigned.apk "dist/AdReaper-${{ steps.version.outputs.VERSION }}-release.apk"
          fi

      - name: Prepare release asset
        run: |
          mkdir -p release
          cp "dist/AdReaper-${{ steps.version.outputs.VERSION }}-release.apk" "release/AdReaper v${{ steps.version.outputs.VERSION }}.apk"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: adreaper-build
          path: dist/*.apk

      - name: Publish GitHub Release (tags or manual run with "release")
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          target_commitish: ${{ github.sha }}
          name: AdReaper v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: release/*.apk
